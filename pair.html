<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>IPTV Magic</title>
<style>
  :root { --bg1: #0aa6b5; --bg2: #067a8a; --ink: #05424c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2)); color: #fff; padding: 24px 18px 40px;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  h1 { font-size: 26px; text-align: center; margin: 8px 0 4px; }
  p.sub { text-align: center; margin: 0 0 22px; opacity: .9; font-size: 15px; }
  label { display: block; font-size: 14px; margin: 14px 4px 6px; opacity: .95; }
  input {
    width: 100%; height: 52px; border: 0; border-radius: 12px; padding: 0 16px; font-size: 17px;
    color: var(--ink); background: rgba(255,255,255,.92); direction: ltr; text-align: left;
  }
  .pw { position: relative; }
  .pw button.eye {
    position: absolute; right: 6px; top: 6px; height: 40px; border: 0; border-radius: 8px; padding: 0 12px;
    background: rgba(5,66,76,.12); color: var(--ink); font-size: 14px;
  }
  button.send {
    width: 100%; height: 56px; margin-top: 24px; border: 0; border-radius: 12px; font-size: 19px; font-weight: 700;
    color: var(--ink); background: #fff;
  }
  button.send:disabled { opacity: .6; }
  #msg { min-height: 28px; margin-top: 16px; text-align: center; font-weight: 700; font-size: 16px; color: #fff3c4; }
  #msg.ok { color: #d8ffe0; }
  .note { margin-top: 22px; font-size: 13px; line-height: 1.7; text-align: center; opacity: .8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>IPTV Magic</h1>
  <p class="sub">أدخل بيانات الاشتراك وهتوصل للتليفزيون</p>

  <label for="n">اسم الحساب (اختياري)</label>
  <input id="n" type="text" autocomplete="off" placeholder="My IPTV">

  <label for="s">عنوان السيرفر</label>
  <input id="s" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="http://example.com:8080">

  <label for="u">اسم المستخدم</label>
  <input id="u" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="Username">

  <label for="p">كلمة المرور</label>
  <div class="pw">
    <input id="p" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="Password">
    <button class="eye" id="eye" type="button">إظهار</button>
  </div>

  <button class="send" id="go" type="button">إرسال للتليفزيون</button>
  <div id="msg"></div>
  <div class="note">البيانات بتتشفّر على الموبايل قبل الإرسال وبتتفك على التليفزيون فقط.</div>
</div>

<script>
(function () {
  var RELAY = 'https://ntfy.sh/';
  var $ = function (id) { return document.getElementById(id); };
  var msg = $('msg'), go = $('go');
  var m = /^#(magic[a-z0-9]{16})(?:\.([A-Za-z0-9_-]{22}))?$/.exec(location.hash || '');
  var topic = m ? m[1] : '', keyStr = m && m[2] ? m[2] : '';

  function say(t, ok) { msg.textContent = t; msg.className = ok ? 'ok' : ''; }
  function b64u(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function fromB64u(str) {
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) str += '=';
    var bin = atob(str), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  if (!topic) { say('امسح الـ QR من شاشة تسجيل الدخول في التليفزيون.'); go.disabled = true; }

  $('eye').onclick = function () {
    var f = $('p'), show = f.type === 'password';
    f.type = show ? 'text' : 'password';
    this.textContent = show ? 'إخفاء' : 'إظهار';
  };

  async function build(o) {
    var json = JSON.stringify(o);
    if (!keyStr) return json;
    if (!(window.crypto && crypto.subtle)) throw new Error('nocrypto');
    var key = await crypto.subtle.importKey('raw', fromB64u(keyStr), { name: 'AES-GCM' }, false, ['encrypt']);
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(json));
    return 'e1.' + b64u(iv) + '.' + b64u(new Uint8Array(ct));
  }

  go.onclick = async function () {
    var s = $('s').value.trim(), u = $('u').value.trim(), p = $('p').value;
    if (!s || !u || !p) { say('اكتب عنوان السيرفر واسم المستخدم وكلمة المرور.'); return; }
    go.disabled = true; say('جارٍ الإرسال…');
    try {
      var body = await build({ v: 1, n: $('n').value.trim(), s: s, u: u, p: p });
      var r = await fetch(RELAY + topic, { method: 'POST', body: body });
      if (!r.ok) throw new Error('http ' + r.status);
      say('تم الإرسال ✓ شوف التليفزيون.', true);
      $('p').value = '';
    } catch (e) {
      say(e && e.message === 'nocrypto' ? 'افتح الصفحة عبر رابط https علشان التشفير يشتغل.' : 'تعذّر الإرسال. تأكد من الإنترنت وجرّب تاني.');
    }
    go.disabled = false;
  };
})();
</script>
</body>
</html>
